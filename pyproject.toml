[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jam-asset-manager"
version = "0.2.0"
description = "A production asset and render-scene manager for Autodesk Maya."
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "Dmitri Ginzburg", email = "ginzburgdd@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/ginzburg-dev/JAM-asset-manager"
Repository = "https://github.com/ginzburg-dev/JAM-asset-manager"
Issues = "https://github.com/ginzburg-dev/JAM-asset-manager/issues"
Changelog = "https://github.com/ginzburg-dev/JAM-asset-manager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1,<2", "ruff>=0.8,<1"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jam_asset_manager = ["resources/icons/*", "ui/forms/*.ui"]

[tool.ruff]
target-version = "py37"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["src/jam_asset_manager/ui/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
